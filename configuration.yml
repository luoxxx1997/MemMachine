logging:
  path: mem-machine.log
  level: info #| debug | error

episode_store:
  database: profile_storage

episodic_memory:
  long_term_memory:
    embedder: openai_embedder
    reranker: my_reranker_id
    vector_graph_store: my_storage_id
  short_term_memory:
    llm_model: openai_model
    message_capacity: 500

semantic_memory:
  llm_model: openai_model
  embedding_model: openai_embedder
  database: profile_storage

session_manager:
  database: profile_storage

prompt:
  session:
  - profile_prompt

resources:
  databases:
    profile_storage:
      provider: postgres
      config:
        host: postgres
        port: 5432
        user: memmachine
        db_name: memmachine
        password: memmachine_password
    my_storage_id:
      provider: neo4j
      config:
        uri: 'bolt://neo4j:7697'
        username: neo4j
        password: neo4j_password
    sqlite_test:
      provider: sqlite
      config:
        path: sqlite_test.db
  embedders:
    openai_embedder:
      provider: openai
      config:
        model: "qwen3-embedding-0.6b"
        api_key: gpustack_a8530ec8ba61baaa_68d5a6a0828496dee4d15c05e489e439
        base_url: "http://192.168.1.86:8899/v1"
        dimensions: 1024
    aws_embedder_id:
      provider: 'amazon-bedrock'
      config:
        region: "us-west-2"
        aws_access_key_id: <AWS_ACCESS_KEY_ID>
        aws_secret_access_key: <AWS_SECRET_ACCESS_KEY>
        model_id: "amazon.titan-embed-text-v2:0"
        similarity_metric: "cosine"
    ollama_embedder:
      provider: openai
      config:
        model: "bge-large-zh-v1.5"
        api_key: gpustack_a8530ec8ba61baaa_68d5a6a0828496dee4d15c05e489e439
        base_url: "http://192.168.1.86:8899/v1"
        dimensions: 1024

  language_models:
    openai_model:
      provider: openai-chat-completions
      config:
        model: "qwen3-8b"
        api_key: gpustack_a8530ec8ba61baaa_68d5a6a0828496dee4d15c05e489e439
        base_url: "http://192.168.1.86:8899/v1"
    aws_model:
      provider: "amazon-bedrock"
      config:
        region: "us-west-2"
        aws_access_key_id: <AWS_ACCESS_KEY_ID>
        aws_secret_access_key: <AWS_SECRET_ACCESS_KEY>
        model_id: "openai.gpt-oss-20b-1:0"
    ollama_model:
      provider: openai-chat-completions
      config:
        model: "qwen3-8b"
        api_key: "gpustack_a8530ec8ba61baaa_68d5a6a0828496dee4d15c05e489e439"
        base_url: "http://192.168.1.86:8899/v1"

  rerankers:
    my_reranker_id:
      provider: "rrf-hybrid"
      config:
        reranker_ids:
          - id_ranker_id
          - bm_ranker_id
          - ce_ranker_id
    id_ranker_id:
      provider: "identity"
    bm_ranker_id:
      provider: "bm25"
    ce_ranker_id:
      provider: "cross-encoder"
      config:
        model_name: "cross-encoder/qnli-electra-base"
    aws_reranker_id:
      provider: "amazon-bedrock"
      config:
        region: "us-west-2"
        aws_access_key_id: <AWS_ACCESS_KEY_ID>
        aws_secret_access_key: <AWS_SECRET_ACCESS_KEY>
        model_id: "amazon.rerank-v1:0"
