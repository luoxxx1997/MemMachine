volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  memmachine_logs:
    driver: local
  memmachine_service_logs:
    driver: local
    #Ollama
#  ollama_data:
#    driver: local

networks:
  memmachine-network:
    driver: bridge
    name: memmachine-network
